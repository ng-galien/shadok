apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spring-devtools
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
# Temporary platform-owned pod used to populate the PVC before the application starts.
apiVersion: v1
kind: Pod
metadata:
  name: spring-devtools-loader
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: loader
      image: shadok-spring:local
      imagePullPolicy: IfNotPresent
      command: [sh, -c, 'sleep 86400']
      volumeMounts:
        - name: devtools
          mountPath: /devtools
  volumes:
    - name: devtools
      persistentVolumeClaim:
        claimName: spring-devtools
