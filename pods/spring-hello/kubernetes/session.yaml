apiVersion: shadok.org/v1alpha1
kind: DevelopmentSession
metadata:
  name: spring-live
spec:
  enabled: false
  deployment: spring
  container: app
  runAsUser: 1000
  runAsGroup: 1000
  directories:
    - name: packaged
      imagePath: /app
      mountPath: /live/packaged
    - name: classes
      imagePath: /tmp
      mountPath: /live/classes
  init:
    - name: unpack
      image: eclipse-temurin:21-jdk
      command: [sh]
      args:
        - -ec
        - |
          mkdir -p /live/packaged/unpacked
          cd /live/packaged/unpacked
          jar --extract --file /live/packaged/application.jar
          if [ -d BOOT-INF/classes ]; then
            cp -R BOOT-INF/classes/. /live/classes/
          else
            cp -R . /live/classes/
          fi
  start:
    command: [java]
    args: [-cp, '/live/classes:/live/packaged/unpacked/BOOT-INF/lib/*:/app/lib/*:/opt/devtools/*', example.Application]
    workingDir: /app
