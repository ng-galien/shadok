{{- $issuer := .Values.webhook.certificate.issuer.name | default "selfsigned-issuer" }}
{{- $serviceName := include "operator.serviceName" . }}
{{- if .Values.webhook.certificate.create }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuer }}
spec:
  selfSigned: { }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "operator.certificateName" . }}
spec:
  secretName: {{ include "operator.certificateSecretName" . }}
  dnsNames:
    - {{ $serviceName }}.{{ .Release.Namespace }}
    - {{ $serviceName }}.{{ .Release.Namespace }}.svc
    - {{ $serviceName }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ $issuer }}
    kind: Issuer
  subject:
    organizations:
      - shadok
    countries:
      - FR
---
{{- end }}