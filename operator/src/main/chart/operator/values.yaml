# Default values for operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the webhook configuration.
webhook:
  configuration:
    # This sets the name of the webhook configuration.
    name: ""
    # This sets the annotations for the webhook configuration.
    annotations: {}
      # cert-manager.io/inject-ca-from: shadok/webhook-server-cert
  # This sets whether the webhook is enabled or not.
  create: true
  # This sets the name of the webhook.
  name: ""
  # This sets the timeout for the webhook.
  timeoutSeconds: 10

  certificate:
    # This sets whether the certificates are created or not.
    create: true
    issuer:
      # This sets the name of the issuer.
      name: ""
    secretName: ""
    # This sets the name of the certificate.
    name: ""
    # This sets the subject for the certificate.
    subject: ""

# This sets the container image, will be interpolated as {{ .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.image.tag }}
# More information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # This sets the image registry.
  registry: $imageRegistry
  # This sets the image name.
  name: $imageName
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: $imageTag

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This section builds out the cluster role more information can be found here: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
clusterRole:
  # Specifies whether a cluster role should be created
  create: true
  # The name of the cluster role to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Annotations to add to the cluster role
  annotations: {}

# This section builds out the cluster role binding more information can be found here: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
clusterRoleBinding:
  # Specifies whether a cluster role binding should be created
  create: true
  # The name of the cluster role binding to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Annotations to add to the cluster role binding
  annotations: {}

# This is for setting the name of the chart.

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
    # This sets the service name more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#name
  name: ""
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8443

monitoring:
  port: 9000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe:
  httpGet:
    path: /q/health/stared
    port: monitoring
  failureThreshold: 10
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 10
livenessProbe:
  httpGet:
    path: /q/health/live
    port: monitoring
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 10
readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /q/health/ready
    port: monitoring
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
