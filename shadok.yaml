version: 1
project: shadok-demos
groups:
  node-source:
    mode: watch
    roots:
      - mount: application
        path: pods/node-hello/src
        exclude: ["**/*.swp", "**/*~"]
  python-source:
    mode: watch
    roots:
      - mount: application
        path: pods/python-hello/src
        exclude: ["**/__pycache__/**", "**/*.pyc", "**/*.swp"]
  quarkus-outputs:
    mode: build
    roots:
      - mount: classes
        path: pods/quarkus-hello/build/classes/java/main
      - mount: resources
        path: pods/quarkus-hello/build/resources/main
        optional: true
